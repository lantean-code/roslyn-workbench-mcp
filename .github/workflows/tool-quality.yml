name: MCP tool definition quality

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Host and test reporting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/tool-quality/requirements.txt
      - name: Install offline lint tooling
        run: python -m pip install --requirement tools/tool-quality/requirements.txt
      - name: Test reporting
        run: python -m unittest discover -s tools/tool-quality -p test_report.py
      - name: Restore Host
        run: dotnet restore src/Roslyn.Workbench.Mcp/Roslyn.Workbench.Mcp.csproj
      - name: Build Host
        run: dotnet build src/Roslyn.Workbench.Mcp/Roslyn.Workbench.Mcp.csproj --no-restore
      - name: Upload built Host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-quality-host
          path: src/Roslyn.Workbench.Mcp/bin/Debug/net10.0
          if-no-files-found: error
          retention-days: 1

  lint:
    name: ${{ matrix.operational-mode }} / ${{ matrix.output-schema-mode }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        operational-mode: [inspection-only, transactional, approval-required, autonomous-trusted]
        output-schema-mode: [Omit, Full]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/tool-quality/requirements.txt
      - name: Install offline lint tooling
        run: python -m pip install --requirement tools/tool-quality/requirements.txt
      - name: Download built Host
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-quality-host
          path: artifacts/tool-quality-host
      - name: Capture and lint operational catalogues
        run: >-
          python tools/tool-quality/report.py
          --host artifacts/tool-quality-host/Roslyn.Workbench.Mcp.dll
          --output artifacts/tool-quality
          --operational-mode ${{ matrix.operational-mode }}
          --tool-output-schema-mode ${{ matrix.output-schema-mode }}
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/tool-quality/summary.md ]; then
            cat artifacts/tool-quality/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tool quality reporting did not complete. See the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload catalogues and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-quality-${{ matrix.operational-mode }}-${{ matrix.output-schema-mode }}
          path: artifacts/tool-quality
          if-no-files-found: warn
          retention-days: 30
