name: Documentation

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "assets/**"
      - "docs/**"
      - "src/**"
      - "tools/Roslyn.Workbench.Mcp.ToolReferenceGenerator/**"
      - "tools/Directory.Build.props"
      - "tools/Directory.Packages.props"
      - "global.json"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "assets/**"
      - "docs/**"
      - "src/**"
      - "tools/Roslyn.Workbench.Mcp.ToolReferenceGenerator/**"
      - "tools/Directory.Build.props"
      - "tools/Directory.Packages.props"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Build documentation
        run: python docs/build.py
      - name: Validate documentation
        run: python docs/validate.py --check-external --allow-unpublished-project-links
      - name: Upload documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-preview
          path: docs/site
          if-no-files-found: error

  deploy-development:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Generate documentation sources
        run: python docs/build.py --skip-mkdocs
      - name: Configure deployment identity
        run: |
          git config user.name "Lantean Code"
          git config user.email "lanteancode@gmail.com"
      - name: Publish development documentation
        run: mike deploy --config-file docs/mkdocs.yml --branch gh-pages --update-aliases dev
      - name: Validate versioned development documentation
        run: python docs/validate.py
      - name: Push development documentation
        run: git push origin gh-pages
