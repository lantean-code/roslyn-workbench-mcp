name: Code-action compatibility audit

on:
  pull_request:
    paths:
      - .github/workflows/code-action-audit.yml
      - Directory.Packages.props
      - global.json
      - src/Roslyn.Workbench.Mcp.CodeActions/**
      - test/Roslyn.Workbench.Mcp.CodeActions.AuditTest/**
      - test/Roslyn.Workbench.Mcp.IntegrationTestSupport/**
      - test/TestAssets/Workspaces/InspectionSample/**
      - docs/RoslynCodeActionsAudit.md
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-action-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Provider and replay compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore test/Roslyn.Workbench.Mcp.CodeActions.AuditTest/Roslyn.Workbench.Mcp.CodeActions.AuditTest.csproj
      - name: Build
        run: dotnet build test/Roslyn.Workbench.Mcp.CodeActions.AuditTest/Roslyn.Workbench.Mcp.CodeActions.AuditTest.csproj --no-restore
      - name: Test
        run: >-
          dotnet test test/Roslyn.Workbench.Mcp.CodeActions.AuditTest/Roslyn.Workbench.Mcp.CodeActions.AuditTest.csproj
          --no-build --no-restore
          --logger "trx;LogFileName=code-action-audit.trx"
          --results-directory TestResults/code-action-audit
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
      - name: Verify test count
        shell: pwsh
        run: ./eng/Assert-TrxTestCount.ps1 -Path TestResults/code-action-audit -Minimum 93
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-code-action-audit
          path: TestResults/code-action-audit
          if-no-files-found: error
