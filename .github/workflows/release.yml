name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation to perform
        required: true
        default: release
        type: choice
        options:
          - release
          - verify-plugin-trusted-publishing
      publish:
        description: Publish the validated package and docs, and prepare a draft GitHub Release
        required: true
        default: false
        type: boolean
      destination:
        description: Package destination; default follows the branch channel
        required: true
        default: default
        type: choice
        options:
          - default
          - github-packages
          - nuget-org

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-plugin-trusted-publishing:
    if: inputs.operation == 'verify-plugin-trusted-publishing'
    name: Verify Plugins NuGet.org trusted publishing
    runs-on: ubuntu-latest
    environment: nuget-org-plugins
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtain temporary Plugins NuGet.org API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Confirm temporary API key was issued
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: test -n "$NUGET_API_KEY"

  prepare:
    if: inputs.operation == 'release'
    name: Build and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
      destination: ${{ steps.release.outputs.destination }}
      full-semver: ${{ steps.release.outputs.full-semver }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      release-notes-path: ${{ steps.release.outputs.release-notes-path }}
      source-distance: ${{ steps.release.outputs.source-distance }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Restore release tools
        run: dotnet tool restore
      - name: Test release evidence utility
        run: python -m unittest tools/release/test_supply_chain_evidence.py
      - name: Test Pages publication
        run: python -m unittest discover -s docs -p test_publish_pages.py
      - name: Calculate release identity
        run: dotnet tool run dotnet-gitversion /output json /nonormalize /nocache > "${{ runner.temp }}/gitversion.json"
      - name: Resolve release channel
        id: release
        run: >-
          python tools/release/resolve-release.py
          --gitversion-json "${{ runner.temp }}/gitversion.json"
          --event-name "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --ref-name "${{ github.ref_name }}"
          --ref-type "${{ github.ref_type }}"
          --requested-destination "${{ inputs.destination }}"
          --requested-publish "${{ inputs.publish }}"
          --github-output "$GITHUB_OUTPUT"
          --manifest artifacts/release/release-manifest.json
      - name: Verify stable release source
        if: steps.release.outputs.channel == 'stable'
        run: |
          if ! git merge-base --is-ancestor "${{ steps.release.outputs.commit }}" origin/main; then
            echo "::error::The production tag must identify a commit from main."
            exit 1
          fi
      - name: Configure release build identity
        run: |
          echo "RoslynWorkbenchReleaseBuild=true" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchVersion=${{ steps.release.outputs.version }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchFullSemVer=${{ steps.release.outputs.full-semver }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchCommitSha=${{ steps.release.outputs.commit }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchVersionSourceDistance=${{ steps.release.outputs.source-distance }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchSourceTag=${{ steps.release.outputs.version }}" >> "$GITHUB_ENV"
      - name: Require approved release notes for publication
        if: steps.release.outputs.publish == 'true'
        run: test -f "${{ steps.release.outputs.release-notes-path }}"
      - name: Restore released dependency graph in locked mode
        run: dotnet restore src/Roslyn.Workbench.Mcp/Roslyn.Workbench.Mcp.csproj --locked-mode
      - name: Restore solution
        run: dotnet restore
      - name: Build
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: dotnet build --configuration Release --no-restore
      - name: Run unit and contract tests
        run: >-
          dotnet test
          --test-modules "test/Roslyn.Workbench.Mcp.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Test.dll;test/Roslyn.Workbench.Mcp.Workspace.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Workspace.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Plugins.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Core.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Plugins.Core.Test.dll;test/Roslyn.Workbench.Mcp.CodeActions.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.CodeActions.Test.dll"
          --root-directory .
          --no-build --no-restore
          --filter "Category!=Integration&Category!=Audit"
          --coverlet --coverlet-output-format json --coverlet-output-format cobertura
          --report-trx
          --results-directory TestResults/release-fast
          --minimum-expected-tests 1732
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Read previous release coverage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python tools/release/download-coverage-baseline.py --source release
          --output "${{ runner.temp }}/release-coverage-baseline.json"
      - name: Summarise release coverage
        run: >-
          python tools/release/coverage-report.py --results TestResults/release-fast
          --output artifacts/release --configuration Release
          --commit "${{ steps.release.outputs.commit }}" --version "${{ steps.release.outputs.version }}"
          --baseline "${{ runner.temp }}/release-coverage-baseline.json"
      - name: Run Workspace integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.Workspace.IntegrationTest/Roslyn.Workbench.Mcp.Workspace.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/workspace
          --minimum-expected-tests 52
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run bundled Core integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/bundled-core
          --minimum-expected-tests 14
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run Code Action integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/code-actions
          --minimum-expected-tests 5
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run Host integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.IntegrationTest/Roslyn.Workbench.Mcp.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/host
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run latest-all analysis
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >-
          dotnet build Roslyn.Workbench.Mcp.slnx
          --configuration Release --no-restore
          -p:AnalysisLevel=latest-all
          -p:EnforceCodeStyleInBuild=true
          -p:CodeAnalysisTreatWarningsAsErrors=false
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Validate immutable release documentation
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          git config user.name "lantean-code"
          git config user.email "lanteancode@gmail.com"
          python docs/deploy-release.py "${{ steps.release.outputs.version }}" \
            --commit "${{ steps.release.outputs.commit }}" \
            --full-semver "${{ steps.release.outputs.full-semver }}" \
            --source-distance "${{ steps.release.outputs.source-distance }}" \
            --dry-run
      - name: Pack release
        run: |
          dotnet pack src/Roslyn.Workbench.Mcp/Roslyn.Workbench.Mcp.csproj \
            --configuration Release --no-build --no-restore \
            --output artifacts/release/package
          dotnet pack src/Roslyn.Workbench.Mcp.Plugins/Roslyn.Workbench.Mcp.Plugins.csproj \
            --configuration Release --no-build --no-restore \
            --output artifacts/release/package
      - name: Separate symbol package
        run: |
          mkdir -p artifacts/release/symbols
          mv artifacts/release/package/*.snupkg artifacts/release/symbols/
      - name: Verify clean tool installation
        run: |
          dotnet tool install Lantean.Roslyn.Workbench.Mcp --tool-path "${{ runner.temp }}/release-tool" --source artifacts/release/package --version "${{ steps.release.outputs.version }}"
          test "$("${{ runner.temp }}/release-tool/roslyn-workbench-mcp" --version)" = "${{ steps.release.outputs.version }}"
      - name: Render release notes
        run: |
          if [ -f "${{ steps.release.outputs.release-notes-path }}" ]; then
            python tools/release/render-release-notes.py --version "${{ steps.release.outputs.version }}" --output artifacts/release/RELEASE_NOTES.md
          fi
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ steps.release.outputs.version }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ steps.release.outputs.version || github.run_id }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}

  acceptance:
    name: Release acceptance (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      RoslynWorkbenchReleaseBuild: true
      RoslynWorkbenchVersion: ${{ needs.prepare.outputs.version }}
      RoslynWorkbenchFullSemVer: ${{ needs.prepare.outputs.full-semver }}
      RoslynWorkbenchCommitSha: ${{ needs.prepare.outputs.commit }}
      RoslynWorkbenchVersionSourceDistance: ${{ needs.prepare.outputs.source-distance }}
      RoslynWorkbenchSourceTag: ${{ needs.prepare.outputs.version }}
      ROSLYN_WORKBENCH_MCP_ACCEPTANCE_RETAIN_ROOT: true
      ROSLYN_WORKBENCH_MCP_ACCEPTANCE_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}
          path: artifacts/release
      - name: Isolate release candidate package source
        shell: pwsh
        run: |
          $configurationPath = Join-Path $env:RUNNER_TEMP 'release-candidate-nuget.config'
          $packageCache = Join-Path $env:RUNNER_TEMP 'release-nuget-packages'
          $packageSource = [System.Security.SecurityElement]::Escape(
            (Resolve-Path artifacts/release/package).Path)

          $configuration = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="ReleaseCandidate" value="$packageSource" />
            </packageSources>
          </configuration>
          "@

          $configuration | Set-Content `
            -Path $configurationPath `
            -Encoding utf8

          $environmentVariables = @(
            "ROSLYN_WORKBENCH_MCP_RELEASE_NUGET_CONFIG=$configurationPath"
            "NUGET_PACKAGES=$packageCache"
          )

          $environmentVariables | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
      - name: Verify dnx acquisition and execution
        shell: pwsh
        run: |
          $packageReference = "Lantean.Roslyn.Workbench.Mcp@${{ needs.prepare.outputs.version }}"
          $actualVersion = dnx $packageReference `
            --configfile $env:ROSLYN_WORKBENCH_MCP_RELEASE_NUGET_CONFIG `
            --yes `
            -- `
            --version

          if ($actualVersion -ne "${{ needs.prepare.outputs.version }}") {
            throw "dnx returned version '$actualVersion'."
          }
      - name: Install release candidate
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'release-tool'
          dotnet tool install Lantean.Roslyn.Workbench.Mcp `
            --tool-path $toolPath `
            --configfile $env:ROSLYN_WORKBENCH_MCP_RELEASE_NUGET_CONFIG `
            --version "${{ needs.prepare.outputs.version }}"

          $executableName = 'roslyn-workbench-mcp'
          if ($IsWindows) {
            $executableName += '.exe'
          }

          $executablePath = Join-Path $toolPath $executableName
          "ROSLYN_WORKBENCH_MCP_ACCEPTANCE_HOST_PATH=$executablePath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
      - name: Restore
        run: dotnet restore test/Roslyn.Workbench.Mcp.AcceptanceTest/Roslyn.Workbench.Mcp.AcceptanceTest.csproj
      - name: Build acceptance harness
        run: dotnet build test/Roslyn.Workbench.Mcp.AcceptanceTest/Roslyn.Workbench.Mcp.AcceptanceTest.csproj --configuration Release --no-restore
      - name: Test published Host on Linux
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          bash ./test/Roslyn.Workbench.Mcp.AcceptanceTest/run-acceptance-tests.sh
          --no-build --no-restore
          --report-trx
          --results-directory TestResults/acceptance
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Test published Host on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          ./test/Roslyn.Workbench.Mcp.AcceptanceTest/run-acceptance-tests.ps1
          --no-build --no-restore
          --report-trx
          --results-directory TestResults/acceptance
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-acceptance-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}
      - name: Upload failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-acceptance-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance-lifetime
          if-no-files-found: ignore
          retention-days: 30

  release-evidence:
    name: Produce release supply-chain evidence
    needs:
      - prepare
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}
          path: artifacts/release
      - name: Restore evidence tools and released dependency graph
        run: |
          dotnet tool restore
          dotnet restore src/Roslyn.Workbench.Mcp/Roslyn.Workbench.Mcp.csproj --locked-mode
      - name: Inventory and scan released dependency graph
        run: |
          mkdir -p "${{ runner.temp }}/dependency-inventory" "${{ runner.temp }}/dependency-vulnerabilities"

          for lock_file in src/Roslyn.Workbench.Mcp*/packages.lock.json; do
            project_directory="$(dirname "$lock_file")"
            project_name="$(basename "$project_directory")"
            project="$project_directory/$project_name.csproj"

            dotnet package list --project "$project" \
              --include-transitive --format json --output-version 1 --no-restore \
              > "${{ runner.temp }}/dependency-inventory/$project_name.json"
            dotnet package list --project "$project" \
              --include-transitive --vulnerable --format json --output-version 1 --no-restore \
              > "${{ runner.temp }}/dependency-vulnerabilities/$project_name.json"
          done
      - name: Generate and validate SPDX SBOM
        run: |
          mkdir -p "${{ runner.temp }}/release-subjects"
          cp artifacts/release/package/*.nupkg artifacts/release/symbols/*.snupkg "${{ runner.temp }}/release-subjects/"
          dotnet tool run sbom-tool --allow-roll-forward -- generate \
            -b "${{ runner.temp }}/release-subjects" \
            -bc "$GITHUB_WORKSPACE/src" \
            -pn Lantean.Roslyn.Workbench.Mcp \
            -pv "${{ needs.prepare.outputs.version }}" \
            -ps "Lantean Code" \
            -nsb "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -mi SPDX:2.2
          dotnet tool run sbom-tool --allow-roll-forward -- validate \
            -b "${{ runner.temp }}/release-subjects" \
            -o "${{ runner.temp }}/sbom-validation.json" \
            -mi SPDX:2.2
          find "${{ runner.temp }}/release-subjects/_manifest" -name manifest.spdx.json -print -quit > "${{ runner.temp }}/sbom-path.txt"
          test -s "${{ runner.temp }}/sbom-path.txt"
          test -s "${{ runner.temp }}/sbom-validation.json"
      - name: Assemble and verify release evidence
        run: >-
          python tools/release/supply-chain-evidence.py --release-root artifacts/release
          --sbom "$(cat "${{ runner.temp }}/sbom-path.txt")"
          --sbom-validation "${{ runner.temp }}/sbom-validation.json"
          --dependency-root src
          --dependency-inventory "${{ runner.temp }}/dependency-inventory"
          --vulnerabilities "${{ runner.temp }}/dependency-vulnerabilities"
          --version "${{ needs.prepare.outputs.version }}" --commit "${{ needs.prepare.outputs.commit }}"
          --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Attest package provenance
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: artifacts/release/supply-chain/subjects.sha256
      - name: Attest package SBOM
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: artifacts/release/supply-chain/subjects.sha256
          sbom-path: artifacts/release/supply-chain/roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}.spdx.json
      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-verified
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
  publish-documentation:
    if: needs.prepare.outputs.publish == 'true'
    name: Publish versioned documentation
    needs:
      - prepare
      - release-evidence
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require an active Pages deployment
        run: test "${{ vars.PAGES_DEPLOYMENT_ENABLED }}" = "true"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Configure deployment identity
        run: |
          git config user.name "lantean-code"
          git config user.email "lanteancode@gmail.com"
      - name: Publish immutable release documentation
        run: >-
          python docs/deploy-release.py "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --full-semver "${{ needs.prepare.outputs.full-semver }}"
          --source-distance "${{ needs.prepare.outputs.source-distance }}"
      - name: Prepare Pages deployment
        run: |
          mkdir -p "${{ runner.temp }}/pages-site"
          git archive refs/remotes/origin/gh-pages | tar -x -C "${{ runner.temp }}/pages-site"
      - name: Upload Pages deployment
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          name: github-pages-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python docs/publish-pages.py
          --artifact-id "${{ steps.pages-artifact.outputs.artifact_id }}"
          --site "${{ runner.temp }}/pages-site"
          --url "${{ steps.pages.outputs.base_url }}"

  publish-github-packages:
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.destination == 'github-packages'
    name: Publish to GitHub Packages
    needs:
      - prepare
      - release-evidence
      - publish-documentation
    runs-on: ubuntu-latest
    environment: github-packages
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-verified
          path: artifacts/release
      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release/ensure-draft-release.py
          --version "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --prerelease "${{ needs.prepare.outputs.prerelease }}"
          --notes-file artifacts/release/RELEASE_NOTES.md
      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for package in artifacts/release/package/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$GITHUB_TOKEN" \
              --source https://nuget.pkg.github.com/lantean-code/index.json
          done
      - name: Attach release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/package/*.nupkg
          artifacts/release/symbols/*.snupkg
          artifacts/release/checksums.sha256
          artifacts/release/release-manifest.json
          artifacts/release/coverage-summary.json
          artifacts/release/coverage.md
          artifacts/release/supply-chain/*.json
          artifacts/release/supply-chain/*.sha256

  publish-nuget:
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.destination == 'nuget-org'
    name: Publish to NuGet.org
    needs:
      - prepare
      - release-evidence
      - publish-documentation
    runs-on: ubuntu-latest
    environment: nuget-org
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
