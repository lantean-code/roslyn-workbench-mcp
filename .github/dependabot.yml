version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    exclude-paths:
      - "ref/**"
      # These compiler packages define the analyser's supported host baseline and are intentionally fixed.
      - "src/Roslyn.Workbench.Mcp.Plugins.Analyzers/**"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 6
    labels:
      - type/maintenance
      - area/ci-release
    ignore:
      # The MCP SDK 2.x migration is deferred to the corresponding product major release.
      - dependency-name: ModelContextProtocol
        update-types:
          - version-update:semver-major
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    open-pull-requests-limit: 4
    labels:
      - type/maintenance
      - area/ci-release
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
