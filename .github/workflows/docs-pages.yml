name: Documentation

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "assets/**"
      - "docs/content/**"
      - "docs/examples/**"
      - "docs/overrides/**"
      - "docs/release/release-notes.md"
      - "docs/*.py"
      - "docs/mkdocs.yml"
      - "docs/docs-requirements.txt"
      - "src/**"
      - "!src/Roslyn.Workbench.Mcp.Plugins.Analyzers/**"
      - "src/Roslyn.Workbench.Mcp.Plugins.Analyzers/Shared/**"
      - "tools/Roslyn.Workbench.Mcp.ToolReferenceGenerator/**"
      - "tools/release/render-release-notes.py"
      - "tools/Directory.Build.props"
      - "tools/Directory.Packages.props"
      - "global.json"
      - "nuget.config"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Build documentation
        run: python docs/build.py
      - name: Validate documentation
        # Repository-owned public URLs are checked after their deployment below.
        run: python docs/validate.py --check-external --skip-project-links
  deploy-development:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Generate documentation sources
        run: python docs/build.py --skip-mkdocs
      - name: Configure deployment identity
        run: |
          git config user.name "lantean-code"
          git config user.email "lanteancode@gmail.com"
      - name: Publish development documentation
        env:
          MIKE_DOCS_VERSION: dev
        run: mike deploy --config-file docs/mkdocs.yml --branch gh-pages --update-aliases dev
      - name: Validate versioned development documentation
        run: python docs/validate.py --deployment-version dev
      - name: Push development documentation
        run: git push origin gh-pages
      - name: Prepare Pages deployment
        if: vars.PAGES_DEPLOYMENT_ENABLED == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/pages-site"
          git archive gh-pages | tar -x -C "${{ runner.temp }}/pages-site"
      - name: Upload Pages deployment
        if: vars.PAGES_DEPLOYMENT_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Configure Pages
        if: vars.PAGES_DEPLOYMENT_ENABLED == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        if: vars.PAGES_DEPLOYMENT_ENABLED == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Validate public documentation links
        if: github.event.repository.private == false && vars.PAGES_DEPLOYMENT_ENABLED == 'true'
        run: python docs/validate.py --deployment-version dev --check-external
