name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated package and docs, and prepare a draft GitHub Release
        required: true
        default: false
        type: boolean
      build-msi:
        description: Build and validate the unsigned Windows MSI; upload run artefacts and include it in the draft when publishing
        required: true
        default: false
        type: boolean
      build-msix:
        description: Build the unsigned Windows MSIX; upload run artefacts and include it in the draft when publishing
        required: true
        default: false
        type: boolean
      build-deb:
        description: Build and validate the Linux DEB; upload run artefacts and include it in the draft when publishing
        required: true
        default: false
        type: boolean
      build-rpm:
        description: Build and validate the Linux RPM; upload run artefacts and include it in the draft when publishing
        required: true
        default: false
        type: boolean
      destination:
        description: Package destination; default follows the branch channel
        required: true
        default: default
        type: choice
        options:
          - default
          - github-packages
          - nuget-org

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      commit: ${{ steps.release.outputs.commit }}
      destination: ${{ steps.release.outputs.destination }}
      full-semver: ${{ steps.release.outputs.full-semver }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      release-notes-path: ${{ steps.release.outputs.release-notes-path }}
      source-distance: ${{ steps.release.outputs.source-distance }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Restore release tools
        run: dotnet tool restore
      - name: Calculate release identity
        run: dotnet tool run dotnet-gitversion /output json /nonormalize /nocache > "${{ runner.temp }}/gitversion.json"
      - name: Resolve release channel
        id: release
        run: >-
          python tools/release/resolve-release.py
          --gitversion-json "${{ runner.temp }}/gitversion.json"
          --event-name "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --ref-name "${{ github.ref_name }}"
          --ref-type "${{ github.ref_type }}"
          --requested-destination "${{ inputs.destination }}"
          --requested-publish "${{ inputs.publish }}"
          --github-output "$GITHUB_OUTPUT"
          --manifest artifacts/release/release-manifest.json
      - name: Verify stable release source
        if: steps.release.outputs.channel == 'stable'
        run: |
          if ! git merge-base --is-ancestor "${{ steps.release.outputs.commit }}" origin/main; then
            echo "::error::The production tag must identify a commit from main."
            exit 1
          fi
      - name: Configure release build identity
        run: |
          echo "RoslynWorkbenchReleaseBuild=true" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchVersion=${{ steps.release.outputs.version }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchFullSemVer=${{ steps.release.outputs.full-semver }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchCommitSha=${{ steps.release.outputs.commit }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchVersionSourceDistance=${{ steps.release.outputs.source-distance }}" >> "$GITHUB_ENV"
          echo "RoslynWorkbenchSourceTag=${{ steps.release.outputs.version }}" >> "$GITHUB_ENV"
      - name: Require approved release notes for publication
        if: steps.release.outputs.publish == 'true'
        run: test -f "${{ steps.release.outputs.release-notes-path }}"
      - name: Restore
        run: dotnet restore
      - name: Build
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: dotnet build --configuration Release --no-restore
      - name: Run unit and contract tests
        run: >-
          dotnet test
          --test-modules "test/Roslyn.Workbench.Mcp.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Test.dll;test/Roslyn.Workbench.Mcp.Workspace.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Workspace.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Plugins.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Core.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.Plugins.Core.Test.dll;test/Roslyn.Workbench.Mcp.CodeActions.Test/bin/Release/net10.0/Roslyn.Workbench.Mcp.CodeActions.Test.dll"
          --root-directory .
          --no-build --no-restore
          --filter "Category!=Integration&Category!=Audit"
          --coverlet --coverlet-output-format json --coverlet-output-format cobertura
          --report-trx
          --results-directory TestResults/release-fast
          --minimum-expected-tests 1732
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Read previous release coverage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python tools/release/download-coverage-baseline.py --source release
          --output "${{ runner.temp }}/release-coverage-baseline.json"
      - name: Summarise release coverage
        run: >-
          python tools/release/coverage-report.py --results TestResults/release-fast
          --output artifacts/release --configuration Release
          --commit "${{ steps.release.outputs.commit }}" --version "${{ steps.release.outputs.version }}"
          --baseline "${{ runner.temp }}/release-coverage-baseline.json"
      - name: Run Workspace integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.Workspace.IntegrationTest/Roslyn.Workbench.Mcp.Workspace.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/workspace
          --minimum-expected-tests 52
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run bundled Core integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/bundled-core
          --minimum-expected-tests 14
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run Code Action integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/code-actions
          --minimum-expected-tests 5
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run Host integration tests
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.IntegrationTest/Roslyn.Workbench.Mcp.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-integration/host
          --minimum-expected-tests 40
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run Code Action compatibility audit
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.CodeActions.AuditTest/Roslyn.Workbench.Mcp.CodeActions.AuditTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/release-audit
          --minimum-expected-tests 93
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Run latest-all analysis
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >-
          dotnet build Roslyn.Workbench.Mcp.slnx
          --configuration Release --no-restore
          -p:AnalysisLevel=latest-all
          -p:EnforceCodeStyleInBuild=true
          -p:CodeAnalysisTreatWarningsAsErrors=false
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Validate immutable release documentation
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          git config user.name "lantean-code"
          git config user.email "lanteancode@gmail.com"
          python docs/deploy-release.py "${{ steps.release.outputs.version }}" \
            --commit "${{ steps.release.outputs.commit }}" \
            --full-semver "${{ steps.release.outputs.full-semver }}" \
            --source-distance "${{ steps.release.outputs.source-distance }}" \
            --dry-run
      - name: Pack release
        run: >-
          dotnet pack src/Roslyn.Workbench.Mcp/Roslyn.Workbench.Mcp.csproj
          --configuration Release --no-build --no-restore
          --output artifacts/release/package
      - name: Separate symbol package
        run: |
          mkdir -p artifacts/release/symbols
          mv artifacts/release/package/*.snupkg artifacts/release/symbols/
      - name: Verify clean tool installation
        run: |
          dotnet tool install Lantean.Roslyn.Workbench.Mcp --tool-path "${{ runner.temp }}/release-tool" --source artifacts/release/package --version "${{ steps.release.outputs.version }}"
          test "$("${{ runner.temp }}/release-tool/roslyn-workbench-mcp" --version)" = "${{ steps.release.outputs.version }}"
      - name: Prepare release evidence
        run: |
          sha256sum artifacts/release/package/*.nupkg artifacts/release/symbols/*.snupkg artifacts/release/release-manifest.json artifacts/release/coverage-summary.json artifacts/release/coverage.md > artifacts/release/checksums.sha256
          if [ -f "${{ steps.release.outputs.release-notes-path }}" ]; then
            python tools/release/render-release-notes.py --version "${{ steps.release.outputs.version }}" --output artifacts/release/RELEASE_NOTES.md
          fi
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ steps.release.outputs.version }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ steps.release.outputs.version || github.run_id }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}

  acceptance:
    name: Release acceptance (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      RoslynWorkbenchReleaseBuild: true
      RoslynWorkbenchVersion: ${{ needs.prepare.outputs.version }}
      RoslynWorkbenchFullSemVer: ${{ needs.prepare.outputs.full-semver }}
      RoslynWorkbenchCommitSha: ${{ needs.prepare.outputs.commit }}
      RoslynWorkbenchVersionSourceDistance: ${{ needs.prepare.outputs.source-distance }}
      RoslynWorkbenchSourceTag: ${{ needs.prepare.outputs.version }}
      ROSLYN_WORKBENCH_MCP_ACCEPTANCE_RETAIN_ROOT: true
      ROSLYN_WORKBENCH_MCP_ACCEPTANCE_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}
          path: artifacts/release
      - name: Install release candidate
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'release-tool'
          dotnet tool install Lantean.Roslyn.Workbench.Mcp --tool-path $toolPath --source artifacts/release/package --version "${{ needs.prepare.outputs.version }}"
          $executableName = if ($IsWindows) { 'roslyn-workbench-mcp.exe' } else { 'roslyn-workbench-mcp' }
          $executablePath = Join-Path $toolPath $executableName
          "ROSLYN_WORKBENCH_MCP_ACCEPTANCE_HOST_PATH=$executablePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore
        run: dotnet restore test/Roslyn.Workbench.Mcp.AcceptanceTest/Roslyn.Workbench.Mcp.AcceptanceTest.csproj
      - name: Build acceptance harness
        run: dotnet build test/Roslyn.Workbench.Mcp.AcceptanceTest/Roslyn.Workbench.Mcp.AcceptanceTest.csproj --configuration Release --no-restore
      - name: Test published Host on Linux
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          bash ./test/Roslyn.Workbench.Mcp.AcceptanceTest/run-acceptance-tests.sh
          --no-build --no-restore
          --report-trx
          --results-directory TestResults/acceptance
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Test published Host on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          ./test/Roslyn.Workbench.Mcp.AcceptanceTest/run-acceptance-tests.ps1
          --no-build --no-restore
          --report-trx
          --results-directory TestResults/acceptance
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-acceptance-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}
      - name: Build unsigned Windows MSI
        if: runner.os == 'Windows' && inputs.build-msi
        shell: pwsh
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./packaging/windows/build-msi.ps1 -OutputDirectory artifacts/installer/release
      - name: Validate MSI installation, repair and removal
        if: runner.os == 'Windows' && inputs.build-msi
        shell: pwsh
        run: >-
          ./packaging/windows/test-msi.ps1
          -MsiPath "artifacts/installer/release/msi/roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64.msi"
          -ExpectedVersion "${{ needs.prepare.outputs.version }}"
          -Install
      - name: Upload Windows MSI
        if: runner.os == 'Windows' && inputs.build-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64-msi
          path: |
            artifacts/installer/release/msi/*.msi
            artifacts/installer/release/msi/*.msi.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload MSI validation logs
        if: always() && runner.os == 'Windows' && inputs.build-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-msi-validation
          path: artifacts/installer/release/msi/validation-*/*.log
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}
      - name: Build unsigned Windows MSIX
        if: runner.os == 'Windows' && inputs.build-msix
        shell: pwsh
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # The hosted Windows image supplies this SDK and Visual Studio MSIX tooling.
        # The script verifies every packaged Host file; unsigned packages are not installed.
        run: >-
          ./packaging/windows/build-msix.ps1
          -OutputDirectory artifacts/msix/release
          -WindowsSdkVersion 10.0.26100.0
      - name: Upload Windows MSIX
        if: runner.os == 'Windows' && inputs.build-msix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64-msix
          path: |
            artifacts/msix/release/*.msix
            artifacts/msix/release/*.msix.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Build Linux DEB
        if: runner.os == 'Linux' && inputs.build-deb
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python3 packaging/linux/build-deb.py --output-directory artifacts/debian/release
      - name: Validate DEB installation, reinstallation and removal
        if: runner.os == 'Linux' && inputs.build-deb
        run: |
          sudo apt-get update
          sudo python3 packaging/linux/test-deb.py \
            --package artifacts/debian/release/*.deb \
            --expected-version "${{ needs.prepare.outputs.version }}" --install
      - name: Upload Linux DEB
        if: runner.os == 'Linux' && inputs.build-deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-linux-x64-deb
          path: |
            artifacts/debian/release/*.deb
            artifacts/debian/release/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload DEB validation logs
        if: always() && runner.os == 'Linux' && inputs.build-deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deb-validation
          path: |
            artifacts/debian/release/validation-*/*.log
            artifacts/debian/release/validation-*/*.json
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}
      - name: Build Linux RPM on Fedora 44
        if: runner.os == 'Linux' && inputs.build-rpm
        env:
          ROSLYN_WORKBENCH_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          host_dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          docker run --rm \
            --volume "$PWD:/workspace" --workdir /workspace \
            --volume "$host_dotnet_root:/opt/dotnet:ro" \
            --env RoslynWorkbenchReleaseBuild \
            --env RoslynWorkbenchVersion \
            --env RoslynWorkbenchFullSemVer \
            --env RoslynWorkbenchCommitSha \
            --env RoslynWorkbenchVersionSourceDistance \
            --env RoslynWorkbenchSourceTag \
            --env ROSLYN_WORKBENCH_SENTRY_DSN \
            --env DOTNET_ROOT=/opt/dotnet \
            --env PATH="/opt/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash -c 'dnf install --assumeyes python3 rpm-build cpio && python3 packaging/linux/build-rpm.py --output-directory artifacts/rpm/release --artifacts-path /tmp/artifacts/roslyn-workbench-mcp'
          sudo chown -R "$(id -u):$(id -g)" artifacts/rpm
      - name: Validate RPM installation, reinstallation and removal on Fedora 44
        if: runner.os == 'Linux' && inputs.build-rpm
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" --workdir /workspace \
            fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash -c 'dnf install --assumeyes python3 rpm cpio && python3 packaging/linux/test-rpm.py --package artifacts/rpm/release/*.rpm --expected-version "${{ needs.prepare.outputs.version }}" --install'
          sudo chown -R "$(id -u):$(id -g)" artifacts/rpm
      - name: Upload Linux RPM
        if: runner.os == 'Linux' && inputs.build-rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-linux-x64-rpm
          path: |
            artifacts/rpm/release/*.rpm
            artifacts/rpm/release/*.rpm.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload RPM validation logs
        if: always() && runner.os == 'Linux' && inputs.build-rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rpm-validation
          path: |
            artifacts/rpm/release/validation-*/*.log
            artifacts/rpm/release/validation-*/*.json
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}
      - name: Upload failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-acceptance-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance-lifetime
          if-no-files-found: ignore
          retention-days: 30

  publish-documentation:
    if: needs.prepare.outputs.publish == 'true'
    name: Publish versioned documentation
    needs:
      - prepare
      - acceptance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require an active Pages deployment
        run: test "${{ vars.PAGES_DEPLOYMENT_ENABLED }}" = "true"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Configure deployment identity
        run: |
          git config user.name "lantean-code"
          git config user.email "lanteancode@gmail.com"
      - name: Publish immutable release documentation
        run: >-
          python docs/deploy-release.py "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --full-semver "${{ needs.prepare.outputs.full-semver }}"
          --source-distance "${{ needs.prepare.outputs.source-distance }}"
      - name: Prepare Pages deployment
        run: |
          mkdir -p "${{ runner.temp }}/pages-site"
          git archive refs/remotes/origin/gh-pages | tar -x -C "${{ runner.temp }}/pages-site"
      - name: Upload Pages deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  publish-github-packages:
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.destination == 'github-packages'
    name: Publish to GitHub Packages
    needs:
      - prepare
      - acceptance
      - publish-documentation
    runs-on: ubuntu-latest
    environment: github-packages
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}
          path: artifacts/release
      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release/ensure-draft-release.py
          --version "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --prerelease "${{ needs.prepare.outputs.prerelease }}"
          --notes-file artifacts/release/RELEASE_NOTES.md
      - name: Download Windows MSI
        if: inputs.build-msi
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64-msi
          path: artifacts/release/installer
      - name: Verify Windows MSI checksum
        if: inputs.build-msi
        working-directory: artifacts/release/installer
        run: sha256sum --check *.msi.sha256
      - name: Download Windows MSIX
        if: inputs.build-msix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64-msix
          path: artifacts/release/msix
      - name: Verify Windows MSIX checksum
        if: inputs.build-msix
        working-directory: artifacts/release/msix
        run: sha256sum --check *.msix.sha256
      - name: Download Linux DEB
        if: inputs.build-deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-linux-x64-deb
          path: artifacts/release/debian
      - name: Verify Linux DEB checksum
        if: inputs.build-deb
        working-directory: artifacts/release/debian
        run: sha256sum --check *.deb.sha256
      - name: Download Linux RPM
        if: inputs.build-rpm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-linux-x64-rpm
          path: artifacts/release/rpm
      - name: Verify Linux RPM checksum
        if: inputs.build-rpm
        working-directory: artifacts/release/rpm
        run: sha256sum --check *.rpm.sha256
      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dotnet nuget push artifacts/release/package/*.nupkg
          --api-key "$GITHUB_TOKEN"
          --source https://nuget.pkg.github.com/lantean-code/index.json
      - name: Attach release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/package/*.nupkg
          artifacts/release/symbols/*.snupkg
          artifacts/release/checksums.sha256
          artifacts/release/release-manifest.json
          artifacts/release/coverage-summary.json
          artifacts/release/coverage.md
      - name: Attach Windows MSI
        if: inputs.build-msi
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/installer/*.msi
          artifacts/release/installer/*.msi.sha256

      - name: Attach Windows MSIX
        if: inputs.build-msix
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/msix/*.msix
          artifacts/release/msix/*.msix.sha256

      - name: Attach Linux DEB
        if: inputs.build-deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/debian/*.deb
          artifacts/release/debian/*.deb.sha256
      - name: Attach Linux RPM
        if: inputs.build-rpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/rpm/*.rpm
          artifacts/release/rpm/*.rpm.sha256

  publish-nuget:
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.destination == 'nuget-org'
    name: Publish to NuGet.org
    needs:
      - prepare
      - acceptance
      - publish-documentation
    runs-on: ubuntu-latest
    environment: nuget-org
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}
          path: artifacts/release
      - name: Create or reuse draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/release/ensure-draft-release.py
          --version "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --prerelease "${{ needs.prepare.outputs.prerelease }}"
          --notes-file artifacts/release/RELEASE_NOTES.md
      - name: Obtain temporary NuGet.org API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Download Windows MSI
        if: inputs.build-msi
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64-msi
          path: artifacts/release/installer
      - name: Verify Windows MSI checksum
        if: inputs.build-msi
        working-directory: artifacts/release/installer
        run: sha256sum --check *.msi.sha256
      - name: Download Windows MSIX
        if: inputs.build-msix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-win-x64-msix
          path: artifacts/release/msix
      - name: Verify Windows MSIX checksum
        if: inputs.build-msix
        working-directory: artifacts/release/msix
        run: sha256sum --check *.msix.sha256
      - name: Download Linux DEB
        if: inputs.build-deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-linux-x64-deb
          path: artifacts/release/debian
      - name: Verify Linux DEB checksum
        if: inputs.build-deb
        working-directory: artifacts/release/debian
        run: sha256sum --check *.deb.sha256
      - name: Download Linux RPM
        if: inputs.build-rpm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roslyn-workbench-mcp-${{ needs.prepare.outputs.version }}-linux-x64-rpm
          path: artifacts/release/rpm
      - name: Verify Linux RPM checksum
        if: inputs.build-rpm
        working-directory: artifacts/release/rpm
        run: sha256sum --check *.rpm.sha256
      - name: Publish package and symbols
        run: |
          cp artifacts/release/symbols/*.snupkg artifacts/release/package/
          dotnet nuget push artifacts/release/package/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
      - name: Attach release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/package/*.nupkg
          artifacts/release/symbols/*.snupkg
          artifacts/release/checksums.sha256
          artifacts/release/release-manifest.json
          artifacts/release/coverage-summary.json
          artifacts/release/coverage.md
      - name: Attach Windows MSI
        if: inputs.build-msi
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/installer/*.msi
          artifacts/release/installer/*.msi.sha256
      - name: Attach Windows MSIX
        if: inputs.build-msix
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/msix/*.msix
          artifacts/release/msix/*.msix.sha256
      - name: Attach Linux DEB
        if: inputs.build-deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/debian/*.deb
          artifacts/release/debian/*.deb.sha256
      - name: Attach Linux RPM
        if: inputs.build-rpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.prepare.outputs.version }}"
          artifacts/release/rpm/*.rpm
          artifacts/release/rpm/*.rpm.sha256
