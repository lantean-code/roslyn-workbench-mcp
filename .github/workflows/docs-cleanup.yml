name: Synchronise documentation versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronise:
    if: vars.PAGES_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: documentation-publication
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out synchronisation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/docs-requirements.txt
      - name: Configure deployment identity
        run: |
          git config user.name "lantean-code"
          git config user.email "lanteancode@gmail.com"
      - name: Synchronise documentation with remote tags
        id: sync
        run: python docs/sync-versions.py --push
      - name: Prepare Pages deployment
        if: steps.sync.outputs.deploy == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/pages-site"
          git archive refs/remotes/origin/gh-pages | tar -x -C "${{ runner.temp }}/pages-site"
      - name: Upload Pages deployment
        if: steps.sync.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-sync-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
      - name: Configure Pages
        if: steps.sync.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        if: steps.sync.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-sync-${{ github.run_attempt }}
