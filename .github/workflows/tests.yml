name: Continuous integration

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
      - "hotfix/**"
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - develop
      - main
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    if: github.event.action != 'labeled' || github.event.label.name == 'validation/full'
    name: Unit and contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.ref }}-fast
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: >-
          dotnet test
          --test-modules "test/Roslyn.Workbench.Mcp.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Test.dll;test/Roslyn.Workbench.Mcp.Workspace.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Workspace.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Plugins.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Core.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Plugins.Core.Test.dll;test/Roslyn.Workbench.Mcp.CodeActions.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.CodeActions.Test.dll"
          --root-directory .
          --no-build --no-restore
          --filter "Category!=Integration&Category!=Audit"
          --coverlet --coverlet-output-format json --coverlet-output-format cobertura
          --report-trx
          --results-directory TestResults/fast
          --minimum-expected-tests 1732
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Read previous coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: >-
          python tools/release/download-coverage-baseline.py --source ci
          --branch "$BASELINE_BRANCH" --output "${{ runner.temp }}/coverage-baseline.json"
      - name: Summarise coverage
        run: >-
          python tools/release/coverage-report.py --results TestResults/fast
          --output artifacts/coverage --configuration Debug --commit "${{ github.sha }}"
          --baseline "${{ runner.temp }}/coverage-baseline.json"
      - name: Upload coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-baseline
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 90
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-fast
          path: TestResults/fast
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}

  integration:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'validation/full') &&
      (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'validation/full'))
    name: Integration (${{ matrix.area }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.ref }}-integration-${{ matrix.area }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: workspace
            project: test/Roslyn.Workbench.Mcp.Workspace.IntegrationTest/Roslyn.Workbench.Mcp.Workspace.IntegrationTest.csproj
            minimum: 52
          - area: bundled-core
            project: test/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest.csproj
            minimum: 14
          - area: code-actions
            project: test/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest.csproj
            minimum: 5
          - area: host
            project: test/Roslyn.Workbench.Mcp.IntegrationTest/Roslyn.Workbench.Mcp.IntegrationTest.csproj
            minimum: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        run: dotnet build "${{ matrix.project }}" --no-restore
      - name: Test
        run: >-
          dotnet test --project "${{ matrix.project }}" --no-build --no-restore
          --report-trx
          --results-directory "TestResults/${{ matrix.area }}"
          --minimum-expected-tests ${{ matrix.minimum }}
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration-${{ matrix.area }}
          path: TestResults/${{ matrix.area }}
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}

  acceptance:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'validation/full') &&
      (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'validation/full'))
    name: Acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.ref }}-acceptance-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      ROSLYN_WORKBENCH_MCP_ACCEPTANCE_RETAIN_ROOT: true
      ROSLYN_WORKBENCH_SENTRY_DSN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test published Host on Linux
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          bash ./test/Roslyn.Workbench.Mcp.AcceptanceTest/run-acceptance-tests.sh
          --no-build --no-restore
          --report-trx
          --results-directory TestResults/acceptance
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Test published Host on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >-
          ./test/Roslyn.Workbench.Mcp.AcceptanceTest/run-acceptance-tests.ps1
          --no-build --no-restore
          --report-trx
          --results-directory TestResults/acceptance
          --minimum-expected-tests 41
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-acceptance-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 30 || 14 }}
      - name: Upload failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance-lifetime
          if-no-files-found: ignore
          retention-days: 30
