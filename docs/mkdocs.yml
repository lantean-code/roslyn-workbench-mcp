site_name: Roslyn Workbench MCP
site_description: Bring Visual Studio-style C# code fixes and refactorings to your AI coding agent with Roslyn Code Actions, semantic analysis and reviewable local transactions.
site_url: https://lantean-code.github.io/roslyn-workbench-mcp/
use_directory_urls: false
repo_url: https://github.com/lantean-code/roslyn-workbench-mcp
repo_name: lantean-code/roslyn-workbench-mcp
docs_dir: content
site_dir: site
strict: true

theme:
  name: material
  font: false
  custom_dir: overrides
  logo: assets/generated/roslyn-workbench-mcp-icon.svg
  favicon: assets/generated/roslyn-workbench-mcp-icon.svg
  language: en
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  documentation_version: !ENV [MIKE_DOCS_VERSION, preview]
  version:
    provider: mike
    default: latest
  generator: false

extra_css:
  - stylesheets/brand.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Release notes: release-notes.md
  - Getting started:
      - Connect a client: getting-started.md
      - Agent setup: agent-setup.md
      - Troubleshooting and removal: troubleshooting.md
      - Build from source: building-from-source.md
  - Using Roslyn Workbench:
      - Tool discovery and results: tool-discovery.md
      - Loading workspaces: workspaces.md
      - Workspaces and transactions: workspaces-and-transactions.md
      - Compiler-impact validation: compiler-validation.md
      - Commit coordination and recovery: transaction-recovery.md
      - Code Actions: code-actions.md
      - Error reporting and privacy: error-reporting.md
  - Configuration and policies:
      - Startup configuration: configuration.md
      - Compatibility policy: compatibility.md
      - Supply-chain evidence: supply-chain.md
  - Plugin authors:
      - Your first plugin: plugin-authoring.md
      - Mutation plugins: plugins/mutations.md
      - Contracts and services: plugins/contracts.md
      - Packaging and deployment: plugins/deployment.md
      - Authoring diagnostics: plugins/diagnostics.md
  - Reference:
      - Tool reference: reference/tools/index.md
      - Security guarantees and evidence: reference/security/index.md
      - Security surface appendix: reference/security/surface.md
      - Agent guide: agent/index.md
  - Support and feedback: https://github.com/lantean-code/roslyn-workbench-mcp/blob/develop/SUPPORT.md
