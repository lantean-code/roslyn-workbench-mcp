next-version: 0.1.0
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-format: '{Major}.{Minor}.{Patch}.0'
assembly-informational-format: '{SemVer}'
commit-date-format: 'yyyyMMddHHmmssFFF'
commit-message-incrementing: Enabled
major-version-bump-message: '\+semver:\s?(major|breaking)'
minor-version-bump-message: '$^'
patch-version-bump-message: '$^'
mode: ContinuousDelivery

branches:
  feature:
    regex: ^feature/
    label: alpha
    increment: Minor
  develop:
    regex: ^develop$
    label: beta
    increment: Minor
  release:
    regex: ^release/
    label: rc
    increment: Minor
  hotfix:
    regex: ^hotfix/
    label: rc
    increment: Patch
  main:
    regex: ^main$
    label: ''
    increment: None
