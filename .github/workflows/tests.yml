name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Unit and contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: >-
          dotnet test
          --test-modules "test/Roslyn.Workbench.Mcp.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Test.dll;test/Roslyn.Workbench.Mcp.Workspace.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Workspace.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Plugins.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Plugins.Analyzers.Test.dll;test/Roslyn.Workbench.Mcp.Plugins.Core.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.Plugins.Core.Test.dll;test/Roslyn.Workbench.Mcp.CodeActions.Test/bin/Debug/net10.0/Roslyn.Workbench.Mcp.CodeActions.Test.dll"
          --root-directory .
          --no-build --no-restore
          --filter "Category!=Integration&Category!=Audit"
          --report-trx
          --results-directory TestResults/fast
          --minimum-expected-tests 1732
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: TestResults/fast
          if-no-files-found: error

  integration:
    name: Integration (${{ matrix.area }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: workspace
            project: test/Roslyn.Workbench.Mcp.Workspace.IntegrationTest/Roslyn.Workbench.Mcp.Workspace.IntegrationTest.csproj
            minimum: 52
          - area: bundled-core
            project: test/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest/Roslyn.Workbench.Mcp.Plugins.Core.IntegrationTest.csproj
            minimum: 14
          - area: code-actions
            project: test/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest/Roslyn.Workbench.Mcp.CodeActions.IntegrationTest.csproj
            minimum: 5
          - area: host
            project: test/Roslyn.Workbench.Mcp.IntegrationTest/Roslyn.Workbench.Mcp.IntegrationTest.csproj
            minimum: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        run: dotnet build "${{ matrix.project }}" --no-restore
      - name: Test
        run: >-
          dotnet test --project "${{ matrix.project }}" --no-build --no-restore
          --report-trx
          --results-directory "TestResults/${{ matrix.area }}"
          --minimum-expected-tests ${{ matrix.minimum }}
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.area }}
          path: TestResults/${{ matrix.area }}
          if-no-files-found: error

  acceptance:
    name: Acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      ROSLYN_WORKBENCH_MCP_ACCEPTANCE_RETAIN_ROOT: true
      ROSLYN_WORKBENCH_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test Windows durability
        if: runner.os == 'Windows'
        run: >-
          dotnet test --project test/Roslyn.Workbench.Mcp.Workspace.IntegrationTest/Roslyn.Workbench.Mcp.Workspace.IntegrationTest.csproj
          --configuration Release --no-build --no-restore
          --report-trx
          --results-directory TestResults/workspace-windows
          --minimum-expected-tests 52
          --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Test published Host
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          dotnet test --project test/Roslyn.Workbench.Mcp.AcceptanceTest/Roslyn.Workbench.Mcp.AcceptanceTest.csproj `
            --configuration Release --no-build --no-restore `
            --report-trx `
            --results-directory TestResults/acceptance `
            --minimum-expected-tests 41 `
            --hangdump --hangdump-timeout 5m --hangdump-type None
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-acceptance-${{ matrix.os }}
          path: TestResults
          if-no-files-found: error
      - name: Upload failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance
            ${{ runner.temp }}/roslyn-workbench-mcp-acceptance-lifetime
          if-no-files-found: ignore
